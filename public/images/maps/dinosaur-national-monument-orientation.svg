<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="map-title">Dinosaur National Monument — Two Areas, One Monument</title>
  <desc id="map-desc">A schematic orientation diagram of Dinosaur National Monument, which is managed as one monument but divided into two very different areas reached by separate entrances. The left panel is the Utah side, the fossil side, entered near Jensen with Vernal, Utah as its basecamp town; its features include the Quarry Exhibit Hall and its Wall of Bones, the Cub Creek Road tour of the tilted rocks, the Cub Creek petroglyphs, the Josie Morris cabin, and Split Mountain. The right panel is the Colorado side, the canyon side, entered near the town of Dinosaur, Colorado; its features include the Harpers Corner Scenic Drive, the Green and Yampa river canyons, Echo Park at the river confluence, and sweeping canyon overlooks, with no dinosaur fossils on display. A central badge marks that the two areas form one monument spanning Utah and Colorado. The diagram shows only which features belong to each area; it is not drawn to scale, distance, road geometry, or compass direction, and the split between the two areas is schematic, not a mapped boundary or the state line.</desc>

  <!--
    Map ID: M-DNM-ORIENT (see docs/M6_REUSABLE_MAP_SYSTEM.md §1, Tier B / base for Tier D)
    Dinosaur National Monument orientation diagram — the "two halves" story.
    Source notes: docs/maps/source/dinosaur-national-monument-orientation.README.md
    Engineering standard: docs/SVG_ENGINEERING_STANDARD.md (authoritative for build).

    Distinct layout by design: a TWO-AREA comparison, not the radial hub-and-spoke of
    M-REGIONAL / M-UTV (which it would otherwise duplicate). Two labeled area panels
    (Utah fossil side | Colorado canyon side), joined by a central "one monument" badge.
    Schematic by design: NO roads, coordinates, mileage, drive times, boundaries, trail
    or road geometry, or park scale (M7.6 factual discipline + the established map system).
    Every feature named traces to src/content/dinosaur-national-monument/visiting-
    dinosaur-national-monument.mdx ("two very different halves", the Utah-side quarry/
    Cub Creek/Josie cabin/Split Mountain, the Colorado-side Harpers Corner/Echo Park/
    Green & Yampa canyons, one monument straddling the Utah-Colorado line).

    COLOR MODEL (per docs/SVG_ENGINEERING_STANDARD.md F1-F3): concrete light-theme hex
    values are set as presentation attributes on every element, so the map renders
    correctly in ALL contexts — including librsvg/sharp rasterizers (og:image,
    astro:assets), which do NOT support CSS var() custom properties. The <style> block
    below is a progressive-enhancement DARK-MODE override only: browsers apply it via
    prefers-color-scheme (and data-theme when inlined); rasterizers ignore it and fall
    back to the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    /* Label knockout halo so text stays legible over its pill (stroke painted first) */
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas        { fill: #201D1A; }
      .land          { fill: #2C2823; }
      .ink           { fill: #F5EDE3; }
      .ink-soft      { fill: #C9BEB2; }
      .spoke         { stroke: #E08A5F; }
      .panel-divider { stroke: #E08A5F; }
      .node-fill     { fill: #47403A; stroke: #E08A5F; }
      .node-text     { fill: #F5EDE3; stroke: #47403A; }
      .glyph-solid   { fill: #F5EDE3; }
      .bullet        { fill: #E08A5F; }
      .chip-alt      { fill: #2C2823; stroke: #E08A5F; }
      .chip-alt-text { fill: #F5EDE3; }
      .legend-node   { fill: #47403A; stroke: #E08A5F; }
      .legend-spoke  { stroke: #E08A5F; }
      /* Vernal (canyon-red) basecamp chip keeps canyon-red + white in both themes (5.1:1) */
    }
    :root[data-theme="dark"] .canvas        { fill: #201D1A; }
    :root[data-theme="dark"] .land          { fill: #2C2823; }
    :root[data-theme="dark"] .ink           { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft      { fill: #C9BEB2; }
    :root[data-theme="dark"] .spoke         { stroke: #E08A5F; }
    :root[data-theme="dark"] .panel-divider { stroke: #E08A5F; }
    :root[data-theme="dark"] .node-fill     { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text     { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .glyph-solid   { fill: #F5EDE3; }
    :root[data-theme="dark"] .bullet        { fill: #E08A5F; }
    :root[data-theme="dark"] .chip-alt      { fill: #2C2823; stroke: #E08A5F; }
    :root[data-theme="dark"] .chip-alt-text { fill: #F5EDE3; }
    :root[data-theme="dark"] .legend-node   { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .legend-spoke  { stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER: background ===================== -->
  <g id="layer-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
    <rect class="land" x="40" y="40" width="1520" height="1120" rx="28" fill="#F5EDE3"/>
  </g>

  <!-- ===================== LAYER: title ===================== -->
  <g id="layer-title">
    <text class="t-title ink" x="800" y="104" text-anchor="middle" font-size="52" fill="#3A3A3A">Dinosaur National Monument</text>
    <text class="t-sub ink-soft" x="800" y="150" text-anchor="middle" font-size="28" fill="#6E655C">One monument, two very different areas &#8212; spanning Utah and Colorado</text>
  </g>

  <!-- ===================== LAYER: central schematic split (decorative) ===================== -->
  <g id="layer-divider" aria-hidden="true">
    <line class="panel-divider" x1="800" y1="252" x2="800" y2="918" stroke="#D4764E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.55"/>
  </g>

  <!-- ===================== LAYER: areas (the two halves) ===================== -->
  <g id="layer-areas" text-anchor="middle">

    <!-- ============ Utah side (left) — the fossil side ============ -->
    <g>
      <rect class="node-fill" x="90" y="196" width="610" height="740" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>

      <!-- header glyph: bone (fossils) — paired with the word below, never shape-alone -->
      <g class="glyph-solid" aria-hidden="true" transform="translate(395,256)" fill="#3A3A3A">
        <rect x="-24" y="-6" width="48" height="12" rx="6"/>
        <circle cx="-24" cy="-11" r="10"/><circle cx="-24" cy="11" r="10"/>
        <circle cx="24" cy="-11" r="10"/><circle cx="24" cy="11" r="10"/>
      </g>

      <text class="node-text t-node" x="395" y="330" font-size="44" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Utah Side</text>
      <text class="node-text t-sub"  x="395" y="368" font-size="22" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">THE FOSSIL SIDE</text>
      <text class="node-text t-sub"  x="395" y="406" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Entrance near Jensen, Utah</text>

      <line x1="150" y1="430" x2="640" y2="430" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>

      <!-- feature list (each marker is always paired with a text label) -->
      <g class="t-sub" text-anchor="start" font-size="30" fill="#3A3A3A">
        <path class="bullet" aria-hidden="true" d="M168,483 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="502" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Quarry Hall &#8212; Wall of Bones</text>

        <path class="bullet" aria-hidden="true" d="M168,547 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="566" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Cub Creek Road &#8212; Tilted Rocks</text>

        <path class="bullet" aria-hidden="true" d="M168,611 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="630" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Cub Creek petroglyphs</text>

        <path class="bullet" aria-hidden="true" d="M168,675 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="694" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Josie Morris cabin</text>

        <path class="bullet" aria-hidden="true" d="M168,739 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="758" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Split Mountain</text>
      </g>

      <text class="node-text t-sub" x="395" y="806" font-size="26" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Fossils, rock art &amp; frontier history</text>

      <!-- Vernal basecamp chip (canyon-red accent = "your basecamp / you are here") -->
      <rect x="145" y="844" width="500" height="72" rx="18" fill="#C1440E"/>
      <text class="t-node" x="395" y="882" font-size="30" fill="#FFFFFF">Vernal, Utah</text>
      <text class="t-sub"  x="395" y="906" font-size="17" letter-spacing="2" fill="#FFFFFF">YOUR BASECAMP &#183; FOSSIL SIDE</text>
    </g>

    <!-- ============ Colorado side (right) — the canyon side ============ -->
    <g>
      <rect class="node-fill" x="900" y="196" width="610" height="740" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>

      <!-- header glyph: canyon walls with a river gap — paired with the word below -->
      <g class="glyph-solid" aria-hidden="true" transform="translate(1205,256)" fill="#3A3A3A">
        <path d="M-32,-18 L-9,-18 L-3,18 L-32,18 Z"/>
        <path d="M32,-18 L9,-18 L3,18 L32,18 Z"/>
      </g>

      <text class="node-text t-node" x="1205" y="330" font-size="44" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Colorado Side</text>
      <text class="node-text t-sub"  x="1205" y="368" font-size="22" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">THE CANYON SIDE</text>
      <text class="node-text t-sub"  x="1205" y="406" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Entrance near Dinosaur, Colorado</text>

      <line x1="960" y1="430" x2="1450" y2="430" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>

      <g class="t-sub" text-anchor="start" font-size="30" fill="#3A3A3A">
        <path class="bullet" aria-hidden="true" d="M978,483 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="502" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Harpers Corner Scenic Drive</text>

        <path class="bullet" aria-hidden="true" d="M978,547 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="566" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Green &amp; Yampa river canyons</text>

        <path class="bullet" aria-hidden="true" d="M978,611 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="630" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Echo Park river confluence</text>

        <path class="bullet" aria-hidden="true" d="M978,675 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="694" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Sweeping canyon overlooks</text>
      </g>

      <text class="node-text t-sub" x="1205" y="806" font-size="26" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">River canyons &amp; overlooks &#8212; no fossils</text>

      <!-- Colorado gateway chip (neutral outline = a gateway town, not the ATV basecamp) -->
      <rect class="chip-alt" x="955" y="844" width="500" height="72" rx="18" fill="#FAF8F5" stroke="#D4764E" stroke-width="3"/>
      <text class="chip-alt-text t-node" x="1205" y="882" font-size="30" fill="#3A3A3A">Dinosaur, Colorado</text>
      <text class="chip-alt-text t-sub"  x="1205" y="906" font-size="17" letter-spacing="2" fill="#3A3A3A">GATEWAY &#183; CANYON SIDE</text>
    </g>
  </g>

  <!-- ===================== LAYER: badge (one monument) ===================== -->
  <g id="layer-badge" text-anchor="middle">
    <circle class="node-fill" cx="800" cy="566" r="86" fill="#E8D5C4" stroke="#D4764E" stroke-width="4"/>
    <text class="node-text t-node" x="800" y="556" font-size="30" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">ONE</text>
    <text class="node-text t-node" x="800" y="592" font-size="26" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">MONUMENT</text>
  </g>

  <!-- ===================== LAYER: legend ===================== -->
  <g id="layer-legend" class="t-legend" font-size="25">
    <!-- basecamp swatch -->
    <rect x="120" y="1022" width="34" height="34" rx="8" fill="#C1440E"/>
    <text class="ink" x="166" y="1048" fill="#3A3A3A">Vernal, Utah &#8212; your basecamp</text>
    <!-- area swatch -->
    <rect class="legend-node" x="600" y="1022" width="34" height="34" rx="8" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
    <text class="ink" x="646" y="1048" fill="#3A3A3A">One of the two monument areas</text>
    <!-- split key -->
    <line class="legend-spoke" x1="1070" y1="1039" x2="1124" y2="1039" stroke="#D4764E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <text class="ink" x="1136" y="1048" fill="#3A3A3A">One monument &#183; two entrances</text>
    <!-- honesty note (two lines) -->
    <text class="t-legend ink-soft" x="800" y="1114" text-anchor="middle" font-size="23" fill="#6E655C">Schematic orientation diagram &#8212; shows which features belong to each area, not to scale, distance, road geometry, or direction.</text>
    <text class="t-legend ink-soft" x="800" y="1146" text-anchor="middle" font-size="23" fill="#6E655C">The two areas are reached by separate entrances; the center split is schematic, not a mapped boundary or the state line.</text>
  </g>
</svg>
