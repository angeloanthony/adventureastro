<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="map-title">Hiking Near Vernal, Utah — High Desert and High Uintas Alpine</title>
  <desc id="map-desc">A schematic orientation diagram showing that hiking around Vernal, Utah falls into two broad environments reached from one basecamp. The left panel is the High Desert and Canyon Country, the lower, warmer country near Vernal, best in spring and fall; its documented destinations include Dinosaur National Monument, the Green and Yampa river canyons, Split Mountain, the Red Fleet dinosaur trackway, and the Flaming Gorge rim trails. The right panel is the High Uintas Alpine Region, the higher, cooler mountain country, best in summer; its documented destinations include Ashley National Forest, hundreds of alpine lakes, Kings Peak (Utah's highest point), the High Uintas Wilderness, and the Uinta Highline Trail. A central badge marks Vernal as the shared basecamp for both environments. The diagram groups hiking destinations by environment; it is not drawn to scale, distance, elevation, or compass direction, and it shows no trailheads, routes, or trail geometry — each destination sits within a region, not at a mapped point.</desc>

  <!--
    Map ID: M-HIKING (see docs/M6_REUSABLE_MAP_SYSTEM.md §1, Tier B cluster overview)
    Hiking-cluster orientation diagram — the "two worlds" story (high desert vs. alpine).
    Source notes: docs/maps/source/vernal-hiking-regions.README.md
    Engineering standard: docs/SVG_ENGINEERING_STANDARD.md (authoritative for build).

    Layout by design: a TWO-PANEL comparison (High Desert & Canyon Country | High Uintas
    Alpine Region), joined by a central canyon-red "Vernal — your basecamp" badge, since
    Vernal is the shared basecamp for both environments. This deliberately reuses the
    M-DNM-ORIENT two-panel language rather than the radial hub-and-spoke of M-REGIONAL /
    M-UTV. Schematic by design: NO drive times, elevations, coordinates, boundaries,
    trailheads, routes, or trail/terrain geometry (M7.8 factual discipline + the whole
    map system). Every destination named traces to src/pages/hiking/index.astro and the
    16 src/content/hiking/*.mdx spokes (the pillar's own "Desert vs. Alpine Hiking" and
    "Choosing the Right Hiking Destination" framing: desert = Dinosaur NM + reservoirs;
    alpine = High Uintas + Ashley NF; Vernal the shared supply base). Kings Peak's
    13,528 ft elevation is documented site-wide but, per the map honesty standard, is
    expressed qualitatively ("Utah's highest") and never as a number on the face.

    COLOR MODEL (per docs/SVG_ENGINEERING_STANDARD.md F1-F3): concrete light-theme hex
    values are set as presentation attributes on every element, so the map renders
    correctly in ALL contexts — including librsvg/sharp rasterizers (og:image,
    astro:assets), which do NOT support CSS var() custom properties. The <style> block
    below is a progressive-enhancement DARK-MODE override only: browsers apply it via
    prefers-color-scheme (and data-theme when inlined); rasterizers ignore it and fall
    back to the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    /* Label knockout halo so text stays legible over its pill (stroke painted first) */
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas        { fill: #201D1A; }
      .land          { fill: #2C2823; }
      .ink           { fill: #F5EDE3; }
      .ink-soft      { fill: #C9BEB2; }
      .spoke         { stroke: #E08A5F; }
      .panel-divider { stroke: #E08A5F; }
      .node-fill     { fill: #47403A; stroke: #E08A5F; }
      .node-text     { fill: #F5EDE3; stroke: #47403A; }
      .glyph-solid   { fill: #F5EDE3; }
      .bullet        { fill: #E08A5F; }
      .chip-alt      { fill: #2C2823; stroke: #E08A5F; }
      .chip-alt-text { fill: #F5EDE3; }
      .legend-node   { fill: #47403A; stroke: #E08A5F; }
      .legend-spoke  { stroke: #E08A5F; }
      /* Vernal (canyon-red) basecamp badge keeps canyon-red + white in both themes (5.1:1) */
    }
    :root[data-theme="dark"] .canvas        { fill: #201D1A; }
    :root[data-theme="dark"] .land          { fill: #2C2823; }
    :root[data-theme="dark"] .ink           { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft      { fill: #C9BEB2; }
    :root[data-theme="dark"] .spoke         { stroke: #E08A5F; }
    :root[data-theme="dark"] .panel-divider { stroke: #E08A5F; }
    :root[data-theme="dark"] .node-fill     { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text     { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .glyph-solid   { fill: #F5EDE3; }
    :root[data-theme="dark"] .bullet        { fill: #E08A5F; }
    :root[data-theme="dark"] .chip-alt      { fill: #2C2823; stroke: #E08A5F; }
    :root[data-theme="dark"] .chip-alt-text { fill: #F5EDE3; }
    :root[data-theme="dark"] .legend-node   { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .legend-spoke  { stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER: background ===================== -->
  <g id="layer-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
    <rect class="land" x="40" y="40" width="1520" height="1120" rx="28" fill="#F5EDE3"/>
  </g>

  <!-- ===================== LAYER: title ===================== -->
  <g id="layer-title">
    <text class="t-title ink" x="800" y="104" text-anchor="middle" font-size="52" fill="#3A3A3A">Hiking Near Vernal, Utah</text>
    <text class="t-sub ink-soft" x="800" y="150" text-anchor="middle" font-size="28" fill="#6E655C">Two hiking worlds from one basecamp &#8212; high desert &amp; canyon country and the High Uintas alpine</text>
  </g>

  <!-- ===================== LAYER: central schematic split (decorative) ===================== -->
  <g id="layer-divider" aria-hidden="true">
    <line class="panel-divider" x1="800" y1="252" x2="800" y2="918" stroke="#D4764E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.55"/>
  </g>

  <!-- ===================== LAYER: environments (the two worlds) ===================== -->
  <g id="layer-areas" text-anchor="middle">

    <!-- ============ High Desert & Canyon Country (left) ============ -->
    <g>
      <rect class="node-fill" x="90" y="196" width="610" height="740" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>

      <!-- header glyph: layered mesa / tilted rock (canyon country) — paired with the words below -->
      <g class="glyph-solid" aria-hidden="true" transform="translate(395,256)" fill="#3A3A3A">
        <path d="M-36,18 L-36,2 L-14,2 L-14,18 Z"/>
        <path d="M-6,18 L-6,-16 L30,-16 L36,18 Z"/>
        <rect x="-36" y="8" width="72" height="3"/>
        <rect x="-6" y="-4" width="42" height="3"/>
      </g>

      <text class="node-text t-node" x="395" y="330" font-size="44" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">High Desert</text>
      <text class="node-text t-sub"  x="395" y="368" font-size="22" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">&amp; CANYON COUNTRY</text>
      <text class="node-text t-sub"  x="395" y="406" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Lower, warmer country near Vernal</text>

      <line x1="150" y1="430" x2="640" y2="430" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>

      <!-- destination list (each marker is always paired with a text label) -->
      <g class="t-sub" text-anchor="start" font-size="30" fill="#3A3A3A">
        <path class="bullet" aria-hidden="true" d="M168,483 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="502" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Dinosaur National Monument</text>

        <path class="bullet" aria-hidden="true" d="M168,547 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="566" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Green &amp; Yampa river canyons</text>

        <path class="bullet" aria-hidden="true" d="M168,611 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="630" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Split Mountain trails</text>

        <path class="bullet" aria-hidden="true" d="M168,675 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="694" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Red Fleet dinosaur trackway</text>

        <path class="bullet" aria-hidden="true" d="M168,739 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="198" y="758" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Flaming Gorge rim trails</text>
      </g>

      <text class="node-text t-sub" x="395" y="806" font-size="26" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Fossils, red rock &amp; river canyons</text>

      <!-- season chip (neutral outline; canyon-red is reserved for the Vernal basecamp badge) -->
      <rect class="chip-alt" x="145" y="844" width="500" height="72" rx="18" fill="#FAF8F5" stroke="#D4764E" stroke-width="3"/>
      <text class="chip-alt-text t-node" x="395" y="882" font-size="28" letter-spacing="2" fill="#3A3A3A">SPRING &amp; FALL</text>
      <text class="chip-alt-text t-sub"  x="395" y="906" font-size="16" letter-spacing="2" fill="#3A3A3A">THE EASIER DESERT SEASON</text>
    </g>

    <!-- ============ High Uintas Alpine Region (right) ============ -->
    <g>
      <rect class="node-fill" x="900" y="196" width="610" height="740" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>

      <!-- header glyph: mountain peaks (alpine) — paired with the words below -->
      <g class="glyph-solid" aria-hidden="true" transform="translate(1205,256)" fill="#3A3A3A">
        <path d="M-34,18 L-10,-16 L14,18 Z"/>
        <path d="M2,18 L22,-6 L36,18 Z"/>
      </g>

      <text class="node-text t-node" x="1205" y="330" font-size="44" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">High Uintas</text>
      <text class="node-text t-sub"  x="1205" y="368" font-size="22" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">ALPINE REGION</text>
      <text class="node-text t-sub"  x="1205" y="406" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Higher, cooler mountain country</text>

      <line x1="960" y1="430" x2="1450" y2="430" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>

      <g class="t-sub" text-anchor="start" font-size="30" fill="#3A3A3A">
        <path class="bullet" aria-hidden="true" d="M978,483 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="502" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Ashley National Forest</text>

        <path class="bullet" aria-hidden="true" d="M978,547 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="566" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Hundreds of alpine lakes</text>

        <path class="bullet" aria-hidden="true" d="M978,611 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="630" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Kings Peak &#8212; Utah&#8217;s highest</text>

        <path class="bullet" aria-hidden="true" d="M978,675 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="694" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">High Uintas Wilderness</text>

        <path class="bullet" aria-hidden="true" d="M978,739 l9,9 l-9,9 l-9,-9 Z" fill="#3A3A3A"/>
        <text class="node-text" x="1008" y="758" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Uinta Highline Trail</text>
      </g>

      <text class="node-text t-sub" x="1205" y="806" font-size="26" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Alpine lakes, high peaks &amp; cool forest</text>

      <!-- season chip (neutral outline) -->
      <rect class="chip-alt" x="955" y="844" width="500" height="72" rx="18" fill="#FAF8F5" stroke="#D4764E" stroke-width="3"/>
      <text class="chip-alt-text t-node" x="1205" y="882" font-size="28" letter-spacing="2" fill="#3A3A3A">SUMMER</text>
      <text class="chip-alt-text t-sub"  x="1205" y="906" font-size="16" letter-spacing="2" fill="#3A3A3A">ONCE THE SNOW CLEARS</text>
    </g>
  </g>

  <!-- ===================== LAYER: badge (Vernal — the shared basecamp) ===================== -->
  <g id="layer-badge" text-anchor="middle">
    <circle cx="800" cy="566" r="88" fill="#C1440E" stroke="#FAF8F5" stroke-width="4"/>
    <text class="t-hub" x="800" y="556" font-size="34" fill="#FFFFFF">VERNAL</text>
    <text class="t-sub" x="800" y="590" font-size="19" letter-spacing="2" fill="#FFFFFF">YOUR</text>
    <text class="t-sub" x="800" y="612" font-size="19" letter-spacing="2" fill="#FFFFFF">BASECAMP</text>
  </g>

  <!-- ===================== LAYER: legend ===================== -->
  <g id="layer-legend" class="t-legend" font-size="25">
    <!-- basecamp swatch -->
    <rect x="120" y="1022" width="34" height="34" rx="8" fill="#C1440E"/>
    <text class="ink" x="166" y="1048" fill="#3A3A3A">Vernal &#8212; your shared basecamp</text>
    <!-- environment swatch -->
    <rect class="legend-node" x="600" y="1022" width="34" height="34" rx="8" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
    <text class="ink" x="646" y="1048" fill="#3A3A3A">One of the two environments</text>
    <!-- split key -->
    <line class="legend-spoke" x1="1070" y1="1039" x2="1124" y2="1039" stroke="#D4764E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <text class="ink" x="1136" y="1048" fill="#3A3A3A">Both reached from Vernal</text>
    <!-- honesty note (two lines) -->
    <text class="t-legend ink-soft" x="800" y="1114" text-anchor="middle" font-size="23" fill="#6E655C">Schematic orientation diagram &#8212; it groups hiking destinations by environment, not to scale, distance, elevation, or direction.</text>
    <text class="t-legend ink-soft" x="800" y="1146" text-anchor="middle" font-size="23" fill="#6E655C">No trailheads, routes, or trail geometry are shown; each destination sits within a region, not at a mapped point.</text>
  </g>
</svg>
