<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="map-title">Fishing Near Vernal, Utah — Four Fishing Environments</title>
  <desc id="map-desc">A schematic orientation diagram grouping the fishing waters around Vernal, Utah into four environments that share Vernal as a basecamp. Top left is the Big Reservoir: Flaming Gorge, known for trophy lake trout and big brown trout, primarily boat water, spanning the Utah and Wyoming line. Top right is the Tailwater River: the Green River below the dam, a blue-ribbon fly-fishing water for wild trout, fished by float trip or wading. Bottom left is the Close-to-Town Reservoirs: Red Fleet and Steinaker, easy family shore fishing for trout, bass, and bluegill. Bottom right is the Alpine Lakes: the Uinta lakes of Ashley National Forest, high-country trout and arctic grayling, best in summer. A central badge marks Vernal as the shared basecamp. The blue shapes are illustrative water symbols, not mapped lakes or rivers; the diagram is not to scale, distance, or direction and shows no lake or river boundaries, boat ramps, access points, or regulations.</desc>

  <!--
    Map ID: M-FISHING (see docs/M6_REUSABLE_MAP_SYSTEM.md §1, Tier B cluster overview)
    Fishing-cluster orientation diagram — the region's waters grouped as a SET by environment.
    Source notes: docs/maps/source/vernal-fishing-waters-overview.README.md
    Engineering standard: docs/SVG_ENGINEERING_STANDARD.md (authoritative for build).

    Layout by design: a 2x2 grouped-quadrant board — Big Reservoir | Tailwater River /
    Close-to-Town Reservoirs | Alpine Lakes — around a central canyon-red "Vernal —
    your basecamp" badge. This is a deliberately NEW layout for the library (the four
    prior maps are radial hub-and-spoke or two-panel), so the fishing map reads as part
    of the branded family without visually duplicating a sibling. Water is emphasized
    (spec §3.5 water role = the styles.css sky-blue token, #A8CDEC) via abstract symbols, never mapped shapes.
    Schematic by design: NO lake/river geometry or boundaries, boat ramps, access points,
    regulations, drive times, distances, or coordinates (M7.10 factual discipline + the
    whole map system). Every water and descriptor traces to src/pages/fishing/index.astro
    (the pillar's "Fishing Regions Overview" table and per-water sections) and the four
    src/content/fishing/*.mdx spokes: Flaming Gorge (trophy lake trout / big browns / boat
    water / straddles the UT-WY border), the Green River tailwater below the dam (blue-ribbon
    fly fishing, wild trout, float trips), Red Fleet & Steinaker (family shore fishing;
    rainbow trout, bass, bluegill), and the Uinta / Ashley National Forest alpine lakes
    (brook/cutthroat/tiger/rainbow trout and arctic grayling; best in summer).

    COLOR MODEL (per docs/SVG_ENGINEERING_STANDARD.md F1-F3): concrete light-theme hex
    values are set as presentation attributes on every element, so the map renders
    correctly in ALL contexts — including librsvg/sharp rasterizers (og:image,
    astro:assets), which do NOT support CSS var() custom properties. The <style> block
    below is a progressive-enhancement DARK-MODE override only: browsers apply it via
    prefers-color-scheme (and data-theme when inlined); rasterizers ignore it and fall
    back to the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    /* Label knockout halo so text stays legible over its pill (stroke painted first) */
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas      { fill: #201D1A; }
      .land        { fill: #2C2823; }
      .ink         { fill: #F5EDE3; }
      .ink-soft    { fill: #C9BEB2; }
      .node-fill   { fill: #47403A; stroke: #E08A5F; }
      .node-text   { fill: #F5EDE3; stroke: #47403A; }
      .water       { fill: #7FA8C9; }
      .legend-node { fill: #47403A; stroke: #E08A5F; }
      /* Vernal (canyon-red) basecamp badge keeps canyon-red + white in both themes (5.1:1) */
    }
    :root[data-theme="dark"] .canvas      { fill: #201D1A; }
    :root[data-theme="dark"] .land        { fill: #2C2823; }
    :root[data-theme="dark"] .ink         { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft    { fill: #C9BEB2; }
    :root[data-theme="dark"] .node-fill   { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text   { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .water       { fill: #7FA8C9; }
    :root[data-theme="dark"] .legend-node { fill: #47403A; stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER: background ===================== -->
  <g id="layer-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
    <rect class="land" x="40" y="40" width="1520" height="1120" rx="28" fill="#F5EDE3"/>
  </g>

  <!-- ===================== LAYER: title ===================== -->
  <g id="layer-title">
    <text class="t-title ink" x="800" y="104" text-anchor="middle" font-size="52" fill="#3A3A3A">Fishing Near Vernal, Utah</text>
    <text class="t-sub ink-soft" x="800" y="150" text-anchor="middle" font-size="28" fill="#6E655C">One basecamp, four fishing environments &#8212; from a trophy reservoir to alpine lakes</text>
  </g>

  <!-- ===================== LAYER: waters (four environments) ===================== -->
  <g id="layer-waters" text-anchor="middle">

    <!-- ============ Big Reservoir (top-left) — Flaming Gorge ============ -->
    <g>
      <rect class="node-fill" x="90" y="196" width="630" height="324" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text t-sub" x="405" y="248" font-size="21" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">BIG RESERVOIR</text>
      <text class="node-text t-node" x="405" y="298" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Flaming Gorge</text>
      <!-- water symbol: a single broad reservoir (illustrative, not a mapped shape) -->
      <ellipse class="water" aria-hidden="true" cx="405" cy="346" rx="118" ry="27" fill="#A8CDEC"/>
      <text class="node-text t-sub" x="405" y="428" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Trophy lake trout &amp; big browns</text>
      <text class="node-text t-sub" x="405" y="464" font-size="20" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Boat water &#183; spans the Utah&#8211;Wyoming line</text>
    </g>

    <!-- ============ Tailwater River (top-right) — Green River ============ -->
    <g>
      <rect class="node-fill" x="880" y="196" width="630" height="324" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text t-sub" x="1195" y="248" font-size="21" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">TAILWATER RIVER</text>
      <text class="node-text t-node" x="1195" y="298" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Green River</text>
      <!-- water symbol: a schematic river ribbon (illustrative, not a mapped course) -->
      <path class="water" aria-hidden="true" d="M1085,346 q27,-22 55,0 t55,0 t55,0" fill="none" stroke="#A8CDEC" stroke-width="15" stroke-linecap="round"/>
      <text class="node-text t-sub" x="1195" y="428" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Wild trout, below the dam</text>
      <text class="node-text t-sub" x="1195" y="464" font-size="20" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Blue-ribbon fly fishing &amp; float trips</text>
    </g>

    <!-- ============ Close-to-Town Reservoirs (bottom-left) — Red Fleet & Steinaker ============ -->
    <g>
      <rect class="node-fill" x="90" y="612" width="630" height="324" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text t-sub" x="405" y="664" font-size="21" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">CLOSE-TO-TOWN RESERVOIRS</text>
      <text class="node-text t-node" x="405" y="714" font-size="33" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Red Fleet &#183; Steinaker</text>
      <!-- water symbol: two small reservoirs (illustrative) -->
      <g class="water" aria-hidden="true" fill="#A8CDEC">
        <ellipse cx="348" cy="762" rx="55" ry="22"/>
        <ellipse cx="470" cy="762" rx="46" ry="19"/>
      </g>
      <text class="node-text t-sub" x="405" y="844" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Trout, bass &amp; bluegill</text>
      <text class="node-text t-sub" x="405" y="880" font-size="20" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Family shore fishing &#183; closest to town</text>
    </g>

    <!-- ============ Alpine Lakes (bottom-right) — Uinta / Ashley NF lakes ============ -->
    <g>
      <rect class="node-fill" x="880" y="612" width="630" height="324" rx="24" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text t-sub" x="1195" y="664" font-size="21" letter-spacing="3" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">ALPINE LAKES</text>
      <text class="node-text t-node" x="1195" y="714" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Uinta Lakes</text>
      <!-- water symbol: a scatter of high lakes (illustrative — "hundreds of alpine lakes") -->
      <g class="water" aria-hidden="true" fill="#A8CDEC">
        <ellipse cx="1150" cy="760" rx="20" ry="12"/>
        <ellipse cx="1200" cy="750" rx="16" ry="10"/>
        <ellipse cx="1246" cy="763" rx="18" ry="11"/>
        <ellipse cx="1172" cy="778" rx="13" ry="8"/>
        <ellipse cx="1222" cy="780" rx="14" ry="9"/>
      </g>
      <text class="node-text t-sub" x="1195" y="844" font-size="22" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Ashley National Forest &#183; trout &amp; grayling</text>
      <text class="node-text t-sub" x="1195" y="880" font-size="20" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">High-country lakes &#183; best in summer</text>
    </g>
  </g>

  <!-- ===================== LAYER: badge (Vernal — the shared basecamp) ===================== -->
  <g id="layer-badge" text-anchor="middle">
    <circle cx="800" cy="566" r="80" fill="#C1440E" stroke="#FAF8F5" stroke-width="6"/>
    <text class="t-hub" x="800" y="560" font-size="30" fill="#FFFFFF">VERNAL</text>
    <text class="t-sub" x="800" y="592" font-size="17" letter-spacing="2" fill="#FFFFFF">BASECAMP</text>
  </g>

  <!-- ===================== LAYER: legend ===================== -->
  <g id="layer-legend" class="t-legend" font-size="25">
    <!-- basecamp swatch -->
    <rect x="120" y="1022" width="34" height="34" rx="8" fill="#C1440E"/>
    <text class="ink" x="166" y="1048" fill="#3A3A3A">Vernal &#8212; your basecamp</text>
    <!-- water swatch -->
    <rect class="water" x="560" y="1022" width="34" height="34" rx="8" fill="#A8CDEC"/>
    <text class="ink" x="606" y="1048" fill="#3A3A3A">Fishing water (schematic symbol)</text>
    <!-- environment swatch -->
    <rect class="legend-node" x="1110" y="1022" width="34" height="34" rx="8" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
    <text class="ink" x="1156" y="1048" fill="#3A3A3A">A fishing environment</text>
    <!-- honesty note (two lines) -->
    <text class="t-legend ink-soft" x="800" y="1114" text-anchor="middle" font-size="23" fill="#6E655C">Schematic orientation diagram &#8212; it groups the region's fishing waters by environment, not to scale, distance, or direction.</text>
    <text class="t-legend ink-soft" x="800" y="1146" text-anchor="middle" font-size="23" fill="#6E655C">The blue shapes are illustrative water symbols, not mapped lakes or rivers; it shows no boundaries, ramps, access points, or regulations.</text>
  </g>
</svg>
