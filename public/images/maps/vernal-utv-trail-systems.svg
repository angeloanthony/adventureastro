<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="map-title">UTV Trail Systems Near Vernal, Utah</title>
  <desc id="map-desc">A schematic diagram of guided UTV trail systems near Vernal, Utah. A central tour staging point in Vernal connects by spokes to five distinct trail systems: Doc's Beach (sandy terrain along the Green River corridor), Moonshine Arch (red-rock canyon leading to a natural sandstone arch), Ashley Gorge (a deep sandstone canyon), Asphalt Ridge (a ridge-top climb with panoramic views), and Outlaw Trail (remote historic backcountry once used by Butch Cassidy). Every guided tour departs from the one Vernal staging point. The diagram shows the trail systems and their shared starting point only; it is not to scale and does not show routes, distances, driving directions, or trailhead locations.</desc>

  <!--
    Map ID: M-UTV (see docs/M6_REUSABLE_MAP_SYSTEM.md Tier B; spec: this asset's
    approved design specification; source notes: docs/maps/source/vernal-utv-trail-systems.README.md)
    Reusable UTV-cluster commercial asset. Restyle/relabel of M-REGIONAL
    (public/images/maps/vernal-regional-hub-and-spoke.svg) — same geometry, palette,
    typography, and engineering conventions. Schematic by design: staging point at
    center, five trail systems as labeled spokes. NO routes, coordinates, mileage,
    drive times, compass direction, or trailhead locations (facts absent from the
    repository AND the Outlaw Trail rock-art protection rule — M6 Section 4).

    COLOR MODEL (important, per docs/SVG_ENGINEERING_STANDARD.md F1-F3): concrete
    light-theme hex values are set as presentation attributes on every element, so
    the map renders correctly in ALL contexts — including librsvg/sharp rasterizers
    (og:image, astro:assets), which do NOT support CSS var() custom properties. The
    <style> block below is a progressive-enhancement DARK-MODE override only: modern
    browsers apply it via prefers-color-scheme (and data-theme when inlined);
    rasterizers ignore it and fall back to the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    /* Label knockout halo so text stays legible over its pill (stroke painted first) */
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas       { fill: #201D1A; }
      .land         { fill: #2C2823; }
      .ink          { fill: #F5EDE3; }
      .ink-soft     { fill: #C9BEB2; }
      .spoke        { stroke: #E08A5F; }
      .node-fill    { fill: #47403A; stroke: #E08A5F; }
      .node-text    { fill: #F5EDE3; stroke: #47403A; }
      .glyph-line   { stroke: #F5EDE3; }
      .glyph-solid  { fill: #F5EDE3; }
      .water        { stroke: #4A5C6B; }
      .water-label  { fill: #8FB4D6; }
      .legend-node  { fill: #47403A; stroke: #E08A5F; }
      .legend-spoke { stroke: #E08A5F; }
      /* hub keeps canyon-red + white in both themes (5.1:1 either way) */
    }
    :root[data-theme="dark"] .canvas       { fill: #201D1A; }
    :root[data-theme="dark"] .land         { fill: #2C2823; }
    :root[data-theme="dark"] .ink          { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft     { fill: #C9BEB2; }
    :root[data-theme="dark"] .spoke        { stroke: #E08A5F; }
    :root[data-theme="dark"] .node-fill    { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text    { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .glyph-line   { stroke: #F5EDE3; }
    :root[data-theme="dark"] .glyph-solid  { fill: #F5EDE3; }
    :root[data-theme="dark"] .water        { stroke: #4A5C6B; }
    :root[data-theme="dark"] .water-label  { fill: #8FB4D6; }
    :root[data-theme="dark"] .legend-node  { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .legend-spoke { stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER: background ===================== -->
  <g id="layer-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
    <rect class="land" x="40" y="40" width="1520" height="1120" rx="28" fill="#F5EDE3"/>
  </g>

  <!-- ===================== LAYER: water (Green River hint — orientation only) ===================== -->
  <g id="layer-water" aria-hidden="true">
    <path class="water" d="M470,752 C560,730 660,776 770,754 C880,732 980,776 1130,752" fill="none" stroke="#A8CDEC" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <text class="t-sub water-label" x="800" y="722" text-anchor="middle" font-size="22" fill="#3E6684">Green River</text>
  </g>

  <!-- ===================== LAYER: title ===================== -->
  <g id="layer-title">
    <text class="t-title ink" x="800" y="112" text-anchor="middle" font-size="54" fill="#3A3A3A">UTV Trail Systems Near Vernal</text>
    <text class="t-sub ink-soft" x="800" y="156" text-anchor="middle" font-size="28" fill="#6E655C">Five distinct trail systems radiate from one staging point</text>
  </g>

  <!-- ===================== LAYER: spokes (staging point 800,610 -> each trail system) ===================== -->
  <g id="layer-spokes" aria-hidden="true" fill="none" stroke-linecap="round">
    <line class="spoke" x1="800" y1="610" x2="360"  y2="315" stroke="#D4764E" stroke-width="7"/> <!-- Doc's Beach -->
    <line class="spoke" x1="800" y1="610" x2="1190" y2="315" stroke="#D4764E" stroke-width="7"/> <!-- Moonshine Arch -->
    <line class="spoke" x1="800" y1="610" x2="1300" y2="610" stroke="#D4764E" stroke-width="7"/> <!-- Ashley Gorge -->
    <line class="spoke" x1="800" y1="610" x2="1215" y2="910" stroke="#D4764E" stroke-width="7"/> <!-- Asphalt Ridge -->
    <line class="spoke" x1="800" y1="610" x2="345"  y2="910" stroke="#D4764E" stroke-width="7"/> <!-- Outlaw Trail -->
  </g>

  <!-- ===================== LAYER: trail-system nodes ===================== -->
  <g id="layer-nodes" text-anchor="middle">

    <!-- 1. Doc's Beach (upper left) — sandy river terrain -->
    <g>
      <rect class="node-fill" x="140" y="229" width="440" height="172" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <g class="glyph-line" aria-hidden="true" transform="translate(360,263)" fill="none" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round">
        <path d="M-30,-8 Q-20,-16 -10,-8 T10,-8 T30,-8"/>
        <path d="M-30,2 Q-20,-6 -10,2 T10,2 T30,2"/>
        <path d="M-30,12 Q-20,4 -10,12 T10,12 T30,12"/>
      </g>
      <text class="node-text t-node" x="360" y="321" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Doc&#8217;s Beach</text>
      <text class="node-text t-sub" x="360" y="361" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Sandy river terrain</text>
    </g>

    <!-- 2. Moonshine Arch (upper right) — red-rock canyon &amp; arch -->
    <g>
      <rect class="node-fill" x="970" y="229" width="440" height="172" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <g class="glyph-line" aria-hidden="true" transform="translate(1190,263)" fill="none" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round">
        <path d="M-30,16 L30,16"/>
        <path d="M-24,16 L-24,-2 Q-24,-18 0,-18 Q24,-18 24,-2 L24,16"/>
      </g>
      <text class="node-text t-node" x="1190" y="321" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Moonshine Arch</text>
      <text class="node-text t-sub" x="1190" y="361" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Red-rock canyon &amp; arch</text>
    </g>

    <!-- 3. Ashley Gorge (right) — deep sandstone canyon -->
    <g>
      <rect class="node-fill" x="1080" y="524" width="440" height="172" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <g class="glyph-solid" aria-hidden="true" transform="translate(1300,558)" fill="#3A3A3A">
        <path d="M-30,-18 L-8,-18 L-2,18 L-30,18 Z"/>
        <path d="M30,-18 L8,-18 L2,18 L30,18 Z"/>
      </g>
      <text class="node-text t-node" x="1300" y="616" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Ashley Gorge</text>
      <text class="node-text t-sub" x="1300" y="656" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Deep sandstone canyon</text>
    </g>

    <!-- 4. Asphalt Ridge (lower right) — ridge-top panoramas -->
    <g>
      <rect class="node-fill" x="995" y="824" width="440" height="172" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <g class="glyph-solid" aria-hidden="true" transform="translate(1215,858)" fill="#3A3A3A">
        <path d="M-30,16 L-8,-16 L4,0 L16,-18 L30,16 Z"/>
      </g>
      <text class="node-text t-node" x="1215" y="916" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Asphalt Ridge</text>
      <text class="node-text t-sub" x="1215" y="956" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Ridge-top panoramas</text>
    </g>

    <!-- 5. Outlaw Trail (lower left) — remote historic country -->
    <g>
      <rect class="node-fill" x="125" y="824" width="440" height="172" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <g class="glyph-solid" aria-hidden="true" transform="translate(345,858)" fill="#3A3A3A">
        <path d="M0,-18 L4.41,-6.07 L17.12,-5.56 L7.13,2.32 L10.58,14.56 L0,7.5 L-10.58,14.56 L-7.13,2.32 L-17.12,-5.56 L-4.41,-6.07 Z"/>
      </g>
      <text class="node-text t-node" x="345" y="916" font-size="38" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Outlaw Trail</text>
      <text class="node-text t-sub" x="345" y="956" font-size="24" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Remote historic country</text>
    </g>
  </g>

  <!-- ===================== LAYER: hub (staging point) ===================== -->
  <g id="layer-hub" text-anchor="middle">
    <rect x="610" y="544" width="380" height="132" rx="24" fill="#C1440E"/>
    <text class="t-hub" x="800" y="604" font-size="60" fill="#FFFFFF">Vernal</text>
    <text class="t-sub" x="800" y="646" font-size="22" fill="#FFFFFF" letter-spacing="3">UTV &#183; TOUR STAGING</text>
  </g>

  <!-- ===================== LAYER: legend ===================== -->
  <g id="layer-legend">
    <!-- row 1: element key -->
    <g class="t-legend" font-size="24">
      <rect x="150" y="1016" width="34" height="34" rx="8" fill="#C1440E"/>
      <text class="ink" x="196" y="1042" fill="#3A3A3A">Tour staging point &#8212; all tours depart here</text>

      <rect class="legend-node" x="770" y="1016" width="34" height="34" rx="8" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="ink" x="816" y="1042" fill="#3A3A3A">Guided trail system</text>

      <line class="legend-spoke" x1="1120" y1="1033" x2="1174" y2="1033" stroke="#D4764E" stroke-width="7" stroke-linecap="round"/>
      <text class="ink" x="1186" y="1042" fill="#3A3A3A">One shared base</text>
    </g>

    <!-- row 2: terrain-glyph key (icons are always paired with a word — never shape-alone) -->
    <g class="t-legend" font-size="22">
      <text class="ink-soft" x="150" y="1092" fill="#6E655C">Terrain:</text>

      <g class="glyph-line" aria-hidden="true" transform="translate(340,1084) scale(0.6)" fill="none" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round">
        <path d="M-30,-8 Q-20,-16 -10,-8 T10,-8 T30,-8"/>
        <path d="M-30,2 Q-20,-6 -10,2 T10,2 T30,2"/>
        <path d="M-30,12 Q-20,4 -10,12 T10,12 T30,12"/>
      </g>
      <text class="ink" x="366" y="1092" text-anchor="start" fill="#3A3A3A">Sand</text>

      <g class="glyph-line" aria-hidden="true" transform="translate(560,1084) scale(0.6)" fill="none" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round">
        <path d="M-30,16 L30,16"/>
        <path d="M-24,16 L-24,-2 Q-24,-18 0,-18 Q24,-18 24,-2 L24,16"/>
      </g>
      <text class="ink" x="586" y="1092" text-anchor="start" fill="#3A3A3A">Arch</text>

      <g class="glyph-solid" aria-hidden="true" transform="translate(770,1084) scale(0.6)" fill="#3A3A3A">
        <path d="M-30,-18 L-8,-18 L-2,18 L-30,18 Z"/>
        <path d="M30,-18 L8,-18 L2,18 L30,18 Z"/>
      </g>
      <text class="ink" x="796" y="1092" text-anchor="start" fill="#3A3A3A">Canyon</text>

      <g class="glyph-solid" aria-hidden="true" transform="translate(1000,1084) scale(0.6)" fill="#3A3A3A">
        <path d="M-30,16 L-8,-16 L4,0 L16,-18 L30,16 Z"/>
      </g>
      <text class="ink" x="1026" y="1092" text-anchor="start" fill="#3A3A3A">Ridge</text>

      <g class="glyph-solid" aria-hidden="true" transform="translate(1230,1084) scale(0.6)" fill="#3A3A3A">
        <path d="M0,-18 L4.41,-6.07 L17.12,-5.56 L7.13,2.32 L10.58,14.56 L0,7.5 L-10.58,14.56 L-7.13,2.32 L-17.12,-5.56 L-4.41,-6.07 Z"/>
      </g>
      <text class="ink" x="1256" y="1092" text-anchor="start" fill="#3A3A3A">Historic</text>
    </g>

    <!-- honesty note -->
    <text class="t-legend ink-soft" x="800" y="1128" text-anchor="middle" font-size="20" fill="#6E655C">Schematic diagram &#8212; shows the trail systems and their shared staging point, not routes, distances, or direction.</text>
    <text class="t-legend ink-soft" x="800" y="1152" text-anchor="middle" font-size="20" fill="#6E655C">Backcountry access is guided; trailheads are not marked.</text>
  </g>
</svg>
