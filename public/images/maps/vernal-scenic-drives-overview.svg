<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="map-title">Scenic Drives Near Vernal, Utah — Four Main Drives from One Basecamp</title>
  <desc id="map-desc">A schematic orientation diagram of the four major scenic driving experiences around Vernal, Utah, all beginning from Vernal as a basecamp. The Flaming Gorge to Uintas Scenic Byway is a byway route known for climbing from high desert through forest to the Flaming Gorge reservoir past geologic-time interpretive signs, the region's complete full-day tour. The Red Cloud Loop is a loop route known for Uinta high country, forest, mountain reservoirs, and solitude. The Sheep Creek Geological Loop is a loop route known for dramatically tilted and folded rock layers and canyon geology, a short showcase. Cub Creek Road, the Tour of the Tilted Rocks, is an out-and-back route on the Utah side of Dinosaur National Monument known for Fremont petroglyphs, dinosaur geology, and the Josie Morris cabin. The route symbols show only each drive's general type, not its mapped course; the diagram is not to scale, distance, or direction and shows no route geometry, mileage, road surface, or seasonal status.</desc>

  <!--
    Map ID: M-SCENIC (see docs/M6_REUSABLE_MAP_SYSTEM.md §1, Tier B cluster overview)
    Scenic-drives orientation diagram — the four main drives as a comparable SET from Vernal.
    Source notes: docs/maps/source/vernal-scenic-drives-overview.README.md
    Engineering standard: docs/SVG_ENGINEERING_STANDARD.md (authoritative for build).

    Layout by design: four full-width "route rows" stacked under a canyon-red Vernal
    basecamp chip. This is a deliberately NEW layout for the library (the five prior maps
    are radial hub-and-spoke, two-panel, or a 2x2 quadrant board), so the scenic map reads
    as part of the branded family without duplicating a sibling, and full-width rows stay
    legible at 360 px. Each drive carries a schematic ROUTE-TYPE glyph (byway / loop /
    out-and-back) — a conceptual symbol, never the drive's real geometry. Schematic by
    design: NO route geometry, mileage, drive times, road-surface classification, elevation,
    coordinates, seasonal openings, or closures (M7.11 factual discipline + the whole map
    system). Every drive and descriptor traces to src/pages/scenic-drives/index.astro (the
    "Best Scenic Drives Overview" table + per-drive sections) and the four
    src/content/scenic-drives/*.mdx spokes: the Flaming Gorge-Uintas Scenic Byway
    (desert-to-forest-to-reservoir, geologic-time signs, the complete full-day tour), the
    Red Cloud Loop (Uinta high country, forest, reservoirs, solitude), the Sheep Creek
    Geological Loop (tilted/folded rock layers, canyon geology, a short showcase), and Cub
    Creek Road / Tour of the Tilted Rocks (Fremont petroglyphs, dinosaur geology, the Josie
    Morris cabin, DNM Utah side; documented as a there-and-back, not a loop).

    COLOR MODEL (per docs/SVG_ENGINEERING_STANDARD.md F1-F3): concrete light-theme hex
    values are set as presentation attributes on every element, so the map renders
    correctly in ALL contexts — including librsvg/sharp rasterizers (og:image,
    astro:assets), which do NOT support CSS var() custom properties. The style block below
    is a progressive-enhancement DARK-MODE override only: browsers apply it via
    prefers-color-scheme (and data-theme when inlined); rasterizers ignore it and fall
    back to the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    /* Label knockout halo so text stays legible over its pill (stroke painted first) */
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas      { fill: #201D1A; }
      .land        { fill: #2C2823; }
      .ink         { fill: #F5EDE3; }
      .ink-soft    { fill: #C9BEB2; }
      .node-fill   { fill: #47403A; stroke: #E08A5F; }
      .node-text   { fill: #F5EDE3; stroke: #47403A; }
      .divider     { stroke: #E08A5F; }
      .route-line  { stroke: #F5EDE3; }
      .route-solid { fill: #F5EDE3; }
      .legend-node { fill: #47403A; stroke: #E08A5F; }
      /* Vernal (canyon-red) basecamp chip keeps canyon-red + white in both themes (5.1:1) */
    }
    :root[data-theme="dark"] .canvas      { fill: #201D1A; }
    :root[data-theme="dark"] .land        { fill: #2C2823; }
    :root[data-theme="dark"] .ink         { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft    { fill: #C9BEB2; }
    :root[data-theme="dark"] .node-fill   { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text   { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .divider     { stroke: #E08A5F; }
    :root[data-theme="dark"] .route-line  { stroke: #F5EDE3; }
    :root[data-theme="dark"] .route-solid { fill: #F5EDE3; }
    :root[data-theme="dark"] .legend-node { fill: #47403A; stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER 1: background ===================== -->
  <g id="layer-1-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
    <rect class="land" x="40" y="40" width="1520" height="1120" rx="28" fill="#F5EDE3"/>
  </g>

  <!-- ===================== LAYER 2: title ===================== -->
  <g id="layer-2-title">
    <text class="t-title ink" x="800" y="100" text-anchor="middle" font-size="52" fill="#3A3A3A">Scenic Drives Near Vernal, Utah</text>
    <text class="t-sub ink-soft" x="800" y="144" text-anchor="middle" font-size="28" fill="#6E655C">Four main scenic drives &#8212; all from one basecamp, each a different kind of day</text>
  </g>

  <!-- ===================== LAYER 3: basecamp chip (Vernal) ===================== -->
  <g id="layer-3-basecamp" text-anchor="middle">
    <rect x="450" y="182" width="700" height="52" rx="16" fill="#C1440E"/>
    <text class="t-node" x="800" y="216" font-size="25" letter-spacing="1" fill="#FFFFFF">VERNAL &#183; YOUR BASECAMP FOR ALL FOUR DRIVES</text>
  </g>

  <!-- ===================== LAYER 4: drives (four route rows) ===================== -->
  <g id="layer-4-drives">

    <!-- Row 1: Flaming Gorge-Uintas Scenic Byway (BYWAY) -->
    <g>
      <rect class="node-fill" x="90" y="248" width="1420" height="150" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <line class="divider" x1="272" y1="288" x2="272" y2="358" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>
      <!-- route-type glyph: a one-way through route (byway) -->
      <g aria-hidden="true" transform="translate(186,315)">
        <line class="route-line" x1="-42" y1="6" x2="30" y2="-6" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
        <path class="route-solid" d="M24,-18 L46,-9 L28,4 Z" fill="#3A3A3A"/>
      </g>
      <text class="node-text t-sub" x="186" y="368" text-anchor="middle" font-size="17" letter-spacing="2" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">BYWAY</text>
      <text class="node-text t-node" x="300" y="317" font-size="33" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Flaming Gorge&#8211;Uintas Scenic Byway</text>
      <text class="node-text t-sub" x="300" y="357" font-size="23" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Desert to forest to reservoir &#183; geologic-time signs &#8212; the complete full-day tour</text>
    </g>

    <!-- Row 2: Red Cloud Loop (LOOP) -->
    <g>
      <rect class="node-fill" x="90" y="414" width="1420" height="150" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <line class="divider" x1="272" y1="454" x2="272" y2="524" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>
      <!-- route-type glyph: a loop -->
      <g aria-hidden="true" transform="translate(186,481)">
        <circle class="route-line" cx="0" cy="0" r="24" fill="none" stroke="#3A3A3A" stroke-width="5"/>
        <path class="route-solid" d="M-8,-24 L10,-24 L1,-9 Z" fill="#3A3A3A"/>
      </g>
      <text class="node-text t-sub" x="186" y="534" text-anchor="middle" font-size="17" letter-spacing="2" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">LOOP</text>
      <text class="node-text t-node" x="300" y="483" font-size="33" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Red Cloud Loop</text>
      <text class="node-text t-sub" x="300" y="523" font-size="23" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Uinta high country, forest, mountain reservoirs &amp; solitude</text>
    </g>

    <!-- Row 3: Sheep Creek Geological Loop (LOOP) -->
    <g>
      <rect class="node-fill" x="90" y="580" width="1420" height="150" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <line class="divider" x1="272" y1="620" x2="272" y2="690" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>
      <!-- route-type glyph: a loop -->
      <g aria-hidden="true" transform="translate(186,647)">
        <circle class="route-line" cx="0" cy="0" r="24" fill="none" stroke="#3A3A3A" stroke-width="5"/>
        <path class="route-solid" d="M-8,-24 L10,-24 L1,-9 Z" fill="#3A3A3A"/>
      </g>
      <text class="node-text t-sub" x="186" y="700" text-anchor="middle" font-size="17" letter-spacing="2" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">LOOP</text>
      <text class="node-text t-node" x="300" y="649" font-size="33" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Sheep Creek Geological Loop</text>
      <text class="node-text t-sub" x="300" y="689" font-size="23" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Dramatically tilted, folded rock layers &#183; a short canyon-geology showcase</text>
    </g>

    <!-- Row 4: Cub Creek Road, Tour of the Tilted Rocks (OUT and BACK) -->
    <g>
      <rect class="node-fill" x="90" y="746" width="1420" height="150" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <line class="divider" x1="272" y1="786" x2="272" y2="856" stroke="#D4764E" stroke-width="2" opacity="0.4" aria-hidden="true"/>
      <!-- route-type glyph: out-and-back (two opposed arrows) -->
      <g aria-hidden="true" transform="translate(186,813)">
        <line class="route-line" x1="-40" y1="-9" x2="30" y2="-9" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
        <path class="route-solid" d="M26,-19 L46,-9 L26,1 Z" fill="#3A3A3A"/>
        <line class="route-line" x1="40" y1="11" x2="-30" y2="11" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
        <path class="route-solid" d="M-26,1 L-46,11 L-26,21 Z" fill="#3A3A3A"/>
      </g>
      <text class="node-text t-sub" x="186" y="866" text-anchor="middle" font-size="17" letter-spacing="2" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">OUT &amp; BACK</text>
      <text class="node-text t-node" x="300" y="815" font-size="33" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Cub Creek Road &#8212; Tour of the Tilted Rocks</text>
      <text class="node-text t-sub" x="300" y="855" font-size="23" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Fremont petroglyphs, dinosaur geology &amp; the Josie Morris cabin &#183; DNM, Utah side</text>
    </g>
  </g>

  <!-- ===================== LAYER 5: legend ===================== -->
  <g id="layer-5-legend" class="t-legend" font-size="25">
    <!-- basecamp swatch -->
    <rect x="150" y="962" width="34" height="34" rx="8" fill="#C1440E"/>
    <text class="ink" x="196" y="988" fill="#3A3A3A">Vernal &#8212; your basecamp</text>
    <!-- drive swatch -->
    <rect class="legend-node" x="640" y="962" width="34" height="34" rx="8" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
    <text class="ink" x="686" y="988" fill="#3A3A3A">A scenic drive &#183; symbol shows its route type</text>
    <!-- honesty note (two lines) -->
    <text class="t-legend ink-soft" x="800" y="1070" text-anchor="middle" font-size="23" fill="#6E655C">Schematic orientation diagram &#8212; it groups the region's four main scenic drives; not to scale, distance, or direction.</text>
    <text class="t-legend ink-soft" x="800" y="1104" text-anchor="middle" font-size="23" fill="#6E655C">The symbols show each drive's general type (loop, byway, or out-and-back), not its mapped course, mileage, road surface, or seasonal status.</text>
    <text class="t-legend ink-soft" x="800" y="1138" text-anchor="middle" font-size="23" fill="#6E655C">All four begin from Vernal. Verify current conditions, seasons, and fees with the managing agency before you drive.</text>
  </g>
</svg>
