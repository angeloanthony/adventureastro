<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="map-title">Vernal, Utah — Hub of Dinosaur Country</title>
  <desc id="map-desc">A schematic hub-and-spoke diagram showing Vernal, Utah at the center as a regional basecamp, connected by spokes to five major surrounding destinations: Dinosaur National Monument, Flaming Gorge, Ashley National Forest, Red Fleet State Park, and Steinaker State Park. The diagram illustrates that Vernal is the hub from which these destinations radiate; it shows relationships only and is not drawn to scale, distance, or compass direction.</desc>

  <!--
    Map ID: M-REGIONAL (see docs/M6_REUSABLE_MAP_SYSTEM.md §1)
    Reusable regional hub-and-spoke asset. Schematic by design: no roads, no
    coordinates, no mileage, no drive times (M6.3 constraint — evergreen concepts
    only). Palette + fonts sampled from public/styles.css.

    COLOR MODEL (important): concrete light-theme hex values are set as
    presentation attributes on every element, so the map renders correctly in
    ALL contexts — including librsvg/sharp rasterizers (og:image, astro:assets),
    which do NOT support CSS var() custom properties. The <style> block below is
    a progressive-enhancement DARK-MODE override only: modern browsers apply it
    for <img>-referenced SVG via prefers-color-scheme (and data-theme when
    inlined); rasterizers ignore it and fall back to the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    /* Label knockout halo so text stays legible over its pill (stroke painted first) */
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas      { fill: #201D1A; }
      .land        { fill: #2C2823; }
      .ink         { fill: #F5EDE3; }
      .ink-soft    { fill: #C9BEB2; }
      .spoke       { stroke: #E08A5F; }
      .node-fill   { fill: #47403A; stroke: #E08A5F; }
      .node-text   { fill: #F5EDE3; stroke: #47403A; }
      .legend-node { fill: #47403A; stroke: #E08A5F; }
      .legend-spoke{ stroke: #E08A5F; }
      /* hub keeps canyon-red + white in both themes (5.1:1 either way) */
    }
    :root[data-theme="dark"] .canvas      { fill: #201D1A; }
    :root[data-theme="dark"] .land        { fill: #2C2823; }
    :root[data-theme="dark"] .ink         { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft    { fill: #C9BEB2; }
    :root[data-theme="dark"] .spoke       { stroke: #E08A5F; }
    :root[data-theme="dark"] .node-fill   { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text   { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .legend-node { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .legend-spoke{ stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER: background ===================== -->
  <g id="layer-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
    <rect class="land" x="40" y="40" width="1520" height="1120" rx="28" fill="#F5EDE3"/>
  </g>

  <!-- ===================== LAYER: title ===================== -->
  <g id="layer-title">
    <text class="t-title ink" x="800" y="118" text-anchor="middle" font-size="54" fill="#3A3A3A">Vernal — Hub of Dinosaur Country</text>
    <text class="t-sub ink-soft" x="800" y="162" text-anchor="middle" font-size="28" fill="#6E655C">The region&#8217;s major destinations radiate from one basecamp</text>
  </g>

  <!-- ===================== LAYER: spokes (hub 800,610 -> each node) ===================== -->
  <g id="layer-spokes" aria-hidden="true" fill="none" stroke-linecap="round">
    <line class="spoke" x1="800" y1="610" x2="1300" y2="610" stroke="#D4764E" stroke-width="7"/> <!-- Dinosaur National Monument -->
    <line class="spoke" x1="800" y1="610" x2="1190" y2="315" stroke="#D4764E" stroke-width="7"/> <!-- Flaming Gorge -->
    <line class="spoke" x1="800" y1="610" x2="360"  y2="315" stroke="#D4764E" stroke-width="7"/> <!-- Ashley National Forest -->
    <line class="spoke" x1="800" y1="610" x2="345"  y2="910" stroke="#D4764E" stroke-width="7"/> <!-- Red Fleet State Park -->
    <line class="spoke" x1="800" y1="610" x2="1215" y2="910" stroke="#D4764E" stroke-width="7"/> <!-- Steinaker State Park -->
  </g>

  <!-- ===================== LAYER: destinations ===================== -->
  <g id="layer-destinations" class="t-node" font-size="40" text-anchor="middle">

    <!-- Dinosaur National Monument (right) -->
    <g>
      <rect class="node-fill" x="1112" y="551" width="376" height="120" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text" x="1300" y="602" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Dinosaur National</text>
      <text class="node-text" x="1300" y="648" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Monument</text>
    </g>

    <!-- Flaming Gorge (upper right) -->
    <g>
      <rect class="node-fill" x="1024" y="269" width="332" height="92" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text" x="1190" y="328" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Flaming Gorge</text>
    </g>

    <!-- Ashley National Forest (upper left) -->
    <g>
      <rect class="node-fill" x="176" y="257" width="368" height="120" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text" x="360" y="308" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Ashley National</text>
      <text class="node-text" x="360" y="354" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Forest</text>
    </g>

    <!-- Red Fleet State Park (lower left) -->
    <g>
      <rect class="node-fill" x="181" y="851" width="328" height="120" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text" x="345" y="902" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Red Fleet</text>
      <text class="node-text" x="345" y="948" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">State Park</text>
    </g>

    <!-- Steinaker State Park (lower right) -->
    <g>
      <rect class="node-fill" x="1043" y="851" width="344" height="120" rx="20" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
      <text class="node-text" x="1215" y="902" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">Steinaker</text>
      <text class="node-text" x="1215" y="948" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="5">State Park</text>
    </g>
  </g>

  <!-- ===================== LAYER: hub (Vernal) ===================== -->
  <g id="layer-hub" text-anchor="middle">
    <rect x="648" y="544" width="304" height="132" rx="24" fill="#C1440E"/>
    <text class="t-hub" x="800" y="606" font-size="62" fill="#FFFFFF">Vernal</text>
    <text class="t-sub" x="800" y="648" font-size="26" fill="#FFFFFF" letter-spacing="3">UTAH &#183; BASECAMP</text>
  </g>

  <!-- ===================== LAYER: legend ===================== -->
  <g id="layer-legend" class="t-legend" font-size="26">
    <!-- hub swatch -->
    <rect x="300" y="1052" width="34" height="34" rx="8" fill="#C1440E"/>
    <text class="ink" x="346" y="1078" fill="#3A3A3A">Vernal — your basecamp</text>
    <!-- destination swatch -->
    <rect class="legend-node" x="700" y="1052" width="34" height="34" rx="8" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
    <text class="ink" x="746" y="1078" fill="#3A3A3A">Regional destination</text>
    <!-- spoke swatch -->
    <line class="legend-spoke" x1="1074" y1="1069" x2="1128" y2="1069" stroke="#D4764E" stroke-width="7" stroke-linecap="round"/>
    <text class="ink" x="1140" y="1078" fill="#3A3A3A">Part of Dinosaur Country</text>
    <!-- honesty note -->
    <text class="t-legend ink-soft" x="800" y="1128" text-anchor="middle" font-size="24" fill="#6E655C">Schematic diagram — shows regional relationships only, not to scale, distance, or compass direction.</text>
  </g>
</svg>
