  <g id="layer-6-footnote">
    <text class="t-sub ink-soft" x="60" y="1158" font-size="19" fill="#6E655C">Every trail is a guided tour with Dave &amp; Trudy Wilson. Character, not a difficulty ranking &#8212; all five welcome first-time riders.</text>
  </g>
</svg>
