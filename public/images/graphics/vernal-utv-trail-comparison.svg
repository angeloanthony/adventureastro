    <rect class="trailtab" x="80" y="300" width="8" height="76" fill="#D4764E"/>
    <text class="t-node trailname" x="104" y="332" font-size="26" fill="#3A3A3A">Doc&#8217;s Beach</text>
    <text class="t-cell ink-soft" x="104" y="364" font-size="19" fill="#6E655C">The one most ride first</text>
    <text class="t-cell ink" x="375" y="345" font-size="21" fill="#3A3A3A">Sandy desert washes</text>
    <text class="t-cell ink" x="670" y="345" font-size="21" fill="#3A3A3A">Green River corridor</text>
    <text class="t-cell ink" x="965" y="345" font-size="21" fill="#3A3A3A">First-timers &amp; families</text>
    <text class="t-cell ink" x="1260" y="333" font-size="21" fill="#3A3A3A">All levels —<tspan x="1260" dy="26">most accessible</tspan></text>

    <!-- Row 2: Moonshine Arch (center y=510) -->
    <rect class="trailtab" x="80" y="472" width="8" height="76" fill="#D4764E"/>
    <text class="t-node trailname" x="104" y="504" font-size="26" fill="#3A3A3A">Moonshine Arch</text>
    <text class="t-cell ink-soft" x="104" y="536" font-size="19" fill="#6E655C">Photogenic canyon ride</text>
    <text class="t-cell ink" x="375" y="517" font-size="21" fill="#3A3A3A">Red-rock canyons</text>
    <text class="t-cell ink" x="670" y="505" font-size="21" fill="#3A3A3A">Natural sandstone<tspan x="670" dy="26">arch</tspan></text>
    <text class="t-cell ink" x="965" y="505" font-size="21" fill="#3A3A3A">Couples &amp; small<tspan x="965" dy="26">groups</tspan></text>
    <text class="t-cell ink" x="1260" y="505" font-size="21" fill="#3A3A3A">All levels —<tspan x="1260" dy="26">more engaging</tspan></text>

    <!-- Row 3: Ashley Gorge (center y=682) -->
    <rect class="trailtab" x="80" y="644" width="8" height="76" fill="#D4764E"/>
    <text class="t-node trailname" x="104" y="676" font-size="26" fill="#3A3A3A">Ashley Gorge</text>
    <text class="t-cell ink-soft" x="104" y="708" font-size="19" fill="#6E655C">Backcountry remoteness</text>
    <text class="t-cell ink" x="375" y="689" font-size="21" fill="#3A3A3A">Canyon corridor</text>
    <text class="t-cell ink" x="670" y="689" font-size="21" fill="#3A3A3A">Dramatic gorge walls</text>
    <text class="t-cell ink" x="965" y="689" font-size="21" fill="#3A3A3A">Backcountry seekers</text>
    <text class="t-cell ink" x="1260" y="677" font-size="21" fill="#3A3A3A">All levels —<tspan x="1260" dy="26">attentive driving</tspan></text>

    <!-- Row 4: Outlaw Trail (center y=854) -->
    <rect class="trailtab" x="80" y="816" width="8" height="76" fill="#D4764E"/>
    <text class="t-node trailname" x="104" y="848" font-size="26" fill="#3A3A3A">Outlaw Trail</text>
    <text class="t-cell ink-soft" x="104" y="880" font-size="19" fill="#6E655C">The ride with the story</text>
    <text class="t-cell ink" x="375" y="843" font-size="21" fill="#3A3A3A">Mixed canyon<tspan x="375" dy="26">&amp; ridge</tspan></text>
    <text class="t-cell ink" x="670" y="843" font-size="21" fill="#3A3A3A">Butch Cassidy history,<tspan x="670" dy="26">petroglyphs</tspan></text>
    <text class="t-cell ink" x="965" y="861" font-size="21" fill="#3A3A3A">History buffs</text>
    <text class="t-cell ink" x="1260" y="843" font-size="21" fill="#3A3A3A">All levels —<tspan x="1260" dy="26">the best story</tspan></text>

    <!-- Row 5: Asphalt Ridge (center y=1026) -->
    <rect class="trailtab" x="80" y="988" width="8" height="76" fill="#D4764E"/>
    <text class="t-node trailname" x="104" y="1020" font-size="26" fill="#3A3A3A">Asphalt Ridge</text>
    <text class="t-cell ink-soft" x="104" y="1052" font-size="19" fill="#6E655C">Elevation, not canyons</text>
    <text class="t-cell ink" x="375" y="1033" font-size="21" fill="#3A3A3A">High ridge-top</text>
    <text class="t-cell ink" x="670" y="1033" font-size="21" fill="#3A3A3A">360&#176; panoramic views</text>
    <text class="t-cell ink" x="965" y="1033" font-size="21" fill="#3A3A3A">Big-view riders</text>
    <text class="t-cell ink" x="1260" y="1033" font-size="21" fill="#3A3A3A">All levels</text>
