<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="graphic-title graphic-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="graphic-title">Compare the Five UTV Trails Near Vernal, Utah</title>
  <desc id="graphic-desc">A comparison matrix of the five guided UTV trail systems near Vernal, Utah documented on the Adventure Tours Vernal website, all offered as three-hour guided Kawasaki KRX 1000 tours. Five trails (rows) are compared across four attributes (columns): signature terrain, scenery highlight, who it suits best, and skill level. Doc's Beach has sandy desert washes, Green River corridor scenery, suits first-timers and families, and is the most accessible trail, welcoming all skill levels. Moonshine Arch has red-rock canyons, a natural sandstone arch, suits couples and small groups, and is all skill levels with more engaging driving. Ashley Gorge is a canyon corridor with dramatic gorge walls, suits backcountry-scenery seekers, and is all skill levels but rewards attentive driving. Outlaw Trail mixes canyon and ridge terrain, features Wild West Butch Cassidy history and petroglyphs, suits history buffs, and is all skill levels with the best story. Asphalt Ridge is a high ridge-top with 360-degree panoramic views, suits big-view riders, and is all skill levels. Every trail is available to all skill levels; the matrix compares character, not difficulty ranking. It reflects only what the site documents and is a planning aid, not a rating.</desc>

  <!--
    Graphic ID: G-UTV-TRAILS (Comparison Graphics library; companion to
    public/images/maps/vernal-utv-trail-systems.svg which answers "where the trails
    are" — this matrix answers "how the trails differ").
    Source notes: docs/graphics/source/vernal-utv-trail-comparison.README.md
    Engineering standard: docs/SVG_ENGINEERING_STANDARD.md (authoritative for build).
    Every cell traces verbatim to src/content/utv/best-utv-trails-vernal.mdx (trail
    descriptions + FAQ). No terrain, difficulty, or "best for" claim is invented; all
    five are documented as suitable for all skill levels. Same visual language, palette,
    typography, accessibility scaffold, and light/dark model as the map + matrix family.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-cell   { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      .canvas    { fill: #201D1A; }
      .header    { fill: #47403A; }
      .stripe    { fill: #262019; }
      .rowbase   { fill: #201D1A; }
      .grid      { stroke: #3E362F; }
      .ink       { fill: #F5EDE3; }
      .ink-soft  { fill: #C9BEB2; }
      .trailtab  { fill: #47403A; stroke: #E08A5F; }
      .trailname { fill: #F5EDE3; }
    }
    :root[data-theme="dark"] .canvas    { fill: #201D1A; }
    :root[data-theme="dark"] .header    { fill: #47403A; }
    :root[data-theme="dark"] .stripe    { fill: #262019; }
    :root[data-theme="dark"] .rowbase   { fill: #201D1A; }
    :root[data-theme="dark"] .grid      { stroke: #3E362F; }
    :root[data-theme="dark"] .ink       { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft  { fill: #C9BEB2; }
    :root[data-theme="dark"] .trailtab  { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .trailname { fill: #F5EDE3; }
  </style>

  <g id="layer-1-background" aria-hidden="true">
    <rect class="canvas" x="0" y="0" width="1600" height="1200" fill="#FAF8F5"/>
  </g>

  <g id="layer-2-title">
    <text class="t-title ink" x="60" y="78" font-size="46" fill="#C1440E">Compare the Five UTV Trails Near Vernal</text>
    <text class="t-sub ink-soft" x="60" y="122" font-size="24" fill="#6E655C">Guided 3-hour Kawasaki KRX 1000 tours &#183; $349 per machine, up to 2 riders &#183; every trail welcomes all skill levels</text>
  </g>

  <g id="layer-3-grid" aria-hidden="true">
    <!-- header band -->
    <rect class="header" x="60" y="170" width="1480" height="82" fill="#E8D5C4"/>
    <!-- row stripes (5 rows, height 172, from y=252) -->
    <rect class="rowbase" x="60" y="252"  width="1480" height="172" fill="#FAF8F5"/>
    <rect class="stripe"  x="60" y="424"  width="1480" height="172" fill="#F0E6D9"/>
    <rect class="rowbase" x="60" y="596"  width="1480" height="172" fill="#FAF8F5"/>
    <rect class="stripe"  x="60" y="768"  width="1480" height="172" fill="#F0E6D9"/>
    <rect class="rowbase" x="60" y="940"  width="1480" height="172" fill="#FAF8F5"/>
    <!-- column separators -->
    <g class="grid" stroke="#E2D2BF" stroke-width="2">
      <line x1="360"  y1="170" x2="360"  y2="1112"/>
      <line x1="655"  y1="170" x2="655"  y2="1112"/>
      <line x1="950"  y1="170" x2="950"  y2="1112"/>
      <line x1="1245" y1="170" x2="1245" y2="1112"/>
      <rect x="60" y="170" width="1480" height="942" fill="none" stroke="#E2D2BF" stroke-width="2"/>
    </g>
  </g>

  <g id="layer-4-header">
    <text class="t-node ink" x="80"   y="220" font-size="24" fill="#3A3A3A">Trail</text>
    <text class="t-node ink" x="375"  y="220" font-size="24" fill="#3A3A3A">Signature terrain</text>
    <text class="t-node ink" x="670"  y="220" font-size="24" fill="#3A3A3A">Scenery highlight</text>
    <text class="t-node ink" x="965"  y="220" font-size="24" fill="#3A3A3A">Best for</text>
    <text class="t-node ink" x="1260" y="220" font-size="24" fill="#3A3A3A">Skill level</text>
  </g>

