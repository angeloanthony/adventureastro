      <text class="node-text t-sub" x="625" y="493" font-size="19" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">out on the land</text>
    </g>
    <!-- Branch C -->
    <g>
      <rect class="node-fill" x="480" y="729" width="290" height="84" rx="18" fill="#E8D5C4" stroke="#D4764E" stroke-width="3"/>
