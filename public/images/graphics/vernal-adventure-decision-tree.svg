<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="graphic-title graphic-desc" preserveAspectRatio="xMidYMid meet" lang="en">
  <title id="graphic-title">Find Your Dinosaur Country Adventure — A Decision Tree by Interest</title>
  <desc id="graphic-desc">A visual decision tree that helps a visitor choose among the major experiences around Vernal, Utah by what they enjoy, starting from Vernal as a basecamp. From a "Start here — what are you in the mood for?" root, four interest branches lead to seven experiences. The "See the icons — fossils and deep time" branch leads to Dinosaurs: real fossils in the rock, petroglyphs, and the Quarry at Dinosaur National Monument. The "Get active — out on the land" branch leads to three experiences: UTV Adventure, guided Kawasaki KRX backcountry tours needing no experience; Hiking, desert canyons to High Uintas alpine trails; and Fishing, reservoirs, alpine lakes, and a blue-ribbon river. The "Take it in at your own pace" branch leads to Scenic Drives, a byway and backcountry loops seen from the car, and Photography, red rock, alpine light, and dark night skies. The "With the kids — family-friendly" branch leads to Family Activities: dinosaur tracks, easy trails, and kid-friendly tours. It is a planning aid, not a rule; many trips combine several of these, each of which has its own in-depth guide on the site. The diagram shows relationships between interests and experiences only; it is not a map and is not to scale, distance, or direction.</desc>

  <!--
    Graphic ID: G-DECISION-TREE (first asset in the Decision Graphics library; see
    docs/M5_IMPLEMENTATION_ROADMAP.md Section 6, "Decision trees" asset class, and
    docs/M5_EEAT_MEDIA_AUDIT.md "which spoke is right for you" selector concept).
    Source notes: docs/graphics/source/vernal-adventure-decision-tree.README.md
    Engineering standard: docs/SVG_ENGINEERING_STANDARD.md (authoritative for build).

    Purpose: unlike the orientation maps (which answer "where"), this DECISION GRAPHIC
    answers "which experience is right for me" by INTEREST, not geography. Layout is a
    left-to-right tree: a canyon-red "Start here" root, four interest branch nodes, and
    seven experience leaves, joined by burnt-orange connectors. New layout for the media
    program, but built from the established visual language (same palette, typography,
    node-pill treatment, accent discipline, accessibility scaffold, and color model).

    Every experience and descriptor traces to documented site content: Dinosaurs =
    src/content/dinosaur-national-monument/** (fossils, Quarry, Cub Creek petroglyphs);
    UTV Adventure = src/content/utv/** + src/pages/booking.astro (guided KRX tours, no
    experience needed); Hiking = src/content/hiking/** + src/pages/hiking (desert-to-alpine
    "two worlds"); Fishing = src/content/fishing/** + src/pages/fishing (reservoirs, alpine
    lakes, the Green River tailwater); Scenic Drives = src/content/scenic-drives/** +
    src/pages/scenic-drives (a byway and backcountry loops); Photography =
    src/content/hiking/photography-hikes-near-vernal + itineraries/photography-weekend-vernal
    (red rock, alpine, dark skies); Family Activities =
    things-to-do/fun-things-to-do-vernal-utah-kids, hiking/family-hiking-near-vernal,
    utv/family-utv-guide-vernal, Red Fleet dinosaur trackway. No invented activities,
    destinations, offerings, routes, or statistics.

    COLOR MODEL (per docs/SVG_ENGINEERING_STANDARD.md F1-F3): concrete light-theme hex
    values are set as presentation attributes on every element, so the graphic renders
    correctly in ALL contexts, including librsvg/sharp rasterizers (og:image, astro:assets),
    which do NOT resolve CSS var() custom properties. The style block below is a
    progressive-enhancement DARK-MODE override only; rasterizers ignore it and fall back to
    the light hex attributes.
  -->

  <style>
    .t-title  { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-sub    { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .t-node   { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .t-hub    { font-family: 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .t-legend { font-family: 'Open Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;  font-weight: 400; }
    .node-text { paint-order: stroke; }

    /* --- Dark-mode override (browsers only; rasterizers keep the light hex attrs) --- */
    @media (prefers-color-scheme: dark) {
      .canvas      { fill: #201D1A; }
      .land        { fill: #2C2823; }
      .ink         { fill: #F5EDE3; }
      .ink-soft    { fill: #C9BEB2; }
      .connector   { stroke: #E08A5F; }
      .node-fill   { fill: #47403A; stroke: #E08A5F; }
      .node-text   { fill: #F5EDE3; stroke: #47403A; }
      .glyph-solid { fill: #F5EDE3; }
      .glyph-line  { stroke: #F5EDE3; }
      .legend-node { fill: #47403A; stroke: #E08A5F; }
      /* Canyon-red "Start here" root keeps canyon-red + white in both themes (5.1:1) */
    }
    :root[data-theme="dark"] .canvas      { fill: #201D1A; }
    :root[data-theme="dark"] .land        { fill: #2C2823; }
    :root[data-theme="dark"] .ink         { fill: #F5EDE3; }
    :root[data-theme="dark"] .ink-soft    { fill: #C9BEB2; }
    :root[data-theme="dark"] .connector   { stroke: #E08A5F; }
    :root[data-theme="dark"] .node-fill   { fill: #47403A; stroke: #E08A5F; }
    :root[data-theme="dark"] .node-text   { fill: #F5EDE3; stroke: #47403A; }
    :root[data-theme="dark"] .glyph-solid { fill: #F5EDE3; }
    :root[data-theme="dark"] .glyph-line  { stroke: #F5EDE3; }
    :root[data-theme="dark"] .legend-node { fill: #47403A; stroke: #E08A5F; }
  </style>

  <!-- ===================== LAYER 1: background ===================== -->
