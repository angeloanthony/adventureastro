    <text class="t-sub ink-soft" x="800" y="138" text-anchor="middle" font-size="27" fill="#6E655C">Choose by what you love &#8212; follow a branch to the experience, then dive into that guide</text>
  </g>

  <!-- ===================== LAYER 3: connectors (decorative) ===================== -->
  <g id="layer-3-connectors" class="connector" aria-hidden="true" fill="none" stroke="#D4764E" stroke-width="4" stroke-linecap="round">
    <!-- root -> four branches -->
    <path d="M410,591 C445,591 445,231 480,231"/>
    <path d="M410,591 C445,591 445,471 480,471"/>
    <path d="M410,591 C445,591 445,771 480,771"/>
    <path d="M410,591 C445,591 445,951 480,951"/>
    <!-- branch A -> leaf 1 -->
    <path d="M770,231 C820,231 820,231 870,231"/>
    <!-- branch B -> leaves 2,3,4 -->
    <path d="M770,471 C820,471 820,351 870,351"/>
    <path d="M770,471 C820,471 820,471 870,471"/>
    <path d="M770,471 C820,471 820,591 870,591"/>
    <!-- branch C -> leaves 5,6 -->
    <path d="M770,771 C820,771 820,711 870,711"/>
    <path d="M770,771 C820,771 820,831 870,831"/>
    <!-- branch D -> leaf 7 -->
    <path d="M770,951 C820,951 820,951 870,951"/>
  </g>

