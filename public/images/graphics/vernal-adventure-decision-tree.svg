        <rect class="glyph-solid" x="-22" y="-4" width="44" height="11" rx="4" fill="#3A3A3A"/>
        <circle class="glyph-solid" cx="-13" cy="12" r="7" fill="#3A3A3A"/><circle class="glyph-solid" cx="13" cy="12" r="7" fill="#3A3A3A"/>
      </g>
      <text class="node-text t-node" x="985" y="345" font-size="27" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">UTV Adventure</text>
      <text class="node-text t-sub" x="985" y="375" font-size="19" fill="#3A3A3A" stroke="#E8D5C4" stroke-width="4">Guided KRX backcountry tours, no experience needed</text>
    </g>
