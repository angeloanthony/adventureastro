    <text class="t-legend ink-soft" x="800" y="1128" text-anchor="middle" font-size="22" fill="#6E655C">A planning aid, not a rule &#8212; many trips mix several of these, all from a Vernal base. It shows interests and experiences, not a map.</text>
  </g>
</svg>
